name: Validación editorial y SEO

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar metadatos, canonicals, enlaces y sitemap
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revisar contenido publicado
        run: node tools/validate-site.mjs
      - name: Comprobar correspondencia entre fuentes y HTML
        run: |
          node tools/editorial-rebuild.mjs
          git diff --exit-code -- '*.html' sitemap.xml
      - name: Probar ejercicios y rúbrica del laboratorio
        run: node tools/test-verification-lab.mjs
